[project]
name = "linden-voice-desk"
version = "1.0.0"
description = "Pipecat voice agent for doctor appointment booking"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501"]  # long prompt strings read better unwrapped

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
